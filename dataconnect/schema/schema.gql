type User @table {
  displayName: String!
  createdAt: Timestamp!
  email: String
  photoUrl: String
  bio: String
}

type Post @table {
  author: User!
  title: String!
  content: String!
  published: Boolean!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  slug: String
  imageUrl: String
}

type Tag @table {
  name: String!
  createdAt: Timestamp!
  description: String
}

type PostTag @table(key: ["post", "tag"]) {
  post: Post!
  tag: Tag!
  createdAt: Timestamp!
}